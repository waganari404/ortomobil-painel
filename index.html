.sc-r1{width:760px;height:760px;right:-260px;top:50%;transform:translateY(-50%)}

.sc-copy h1 span{color:#54D06E}

.sc-rem input{width:18px;height:18px;accent-color:#54D06E}
.sc-btn{width:100%;border:0;border-radius:14px;padding:16px;font:inherit;font-size:15px;font-weight:700;letter-spacing:.04em;color:#00330B;cursor:pointer;background:linear-gradient(135deg,#7BE495,#54D06E 50%,#359D4B);box-shadow:0 12px 30px rgba(84,208,110,.28);transition:transform .12s,filter .12s}
.sc-btn:hover{filter:brightness(1.05);transform:translateY(-1px)}
