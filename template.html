*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:Montserrat,system-ui,sans-serif;color:#EAF7EE;background:#03140A;-webkit-font-smoothing:antialiased}
.hidden{display:none!important}
#staticrypt_content{min-height:100vh}
.sc-load{height:100%;display:flex;align-items:center;justify-content:center}
.sc-spin{width:34px;height:34px;border-radius:50%;border:3px solid rgba(84,208,110,.2);border-top-color:#54D06E;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sc{min-height:100vh;display:grid;grid-template-columns:1.15fr minmax(360px,.85fr);
  background:radial-gradient(1000px 640px at 12% 0%,rgba(84,208,110,.20),transparent 60%),radial-gradient(800px 600px at 100% 100%,rgba(45,212,191,.12),transparent 60%),linear-gradient(160deg,#062012,#03140A 60%)}
.sc-hero{position:relative;overflow:hidden;padding:clamp(28px,5vw,64px);display:flex;flex-direction:column;justify-content:space-between;border-right:1px solid rgba(84,208,110,.12)}
.sc-hero img{width:190px;height:auto;position:relative;z-index:2}
.sc-ring{position:absolute;border-radius:50%;border:1px solid rgba(84,208,110,.16)}
.sc-r1{width:760px;height:760px;right:-260px;top:50%;transform:translateY(-50%)}
.sc-r2{width:540px;height:540px;right:-150px;top:50%;transform:translateY(-50%);border-color:rgba(84,208,110,.22)}
.sc-r3{width:320px;height:320px;right:-40px;top:50%;transform:translateY(-50%);background:radial-gradient(circle at 35% 35%,rgba(84,208,110,.35),rgba(53,157,75,.08) 60%,transparent 70%);border-color:rgba(84,208,110,.35)}
.sc-lines{position:absolute;right:20px;top:50%;transform:translateY(-50%);width:240px;display:flex;flex-direction:column;gap:12px;z-index:1;opacity:.9}
.sc-lines i{display:block;height:6px;border-radius:6px;background:linear-gradient(90deg,#54D06E,rgba(84,208,110,.15))}
.sc-copy{position:relative;z-index:2;max-width:560px}
.sc-kick{font-size:12px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:#54D06E;margin:0 0 18px}
.sc-copy h1{font-size:clamp(38px,5.4vw,68px);line-height:.98;font-weight:800;letter-spacing:-.02em;margin:0}
.sc-copy h1 span{color:#54D06E}
.sc-tag{margin-top:22px;font-size:14px;letter-spacing:.32em;text-transform:uppercase;color:#8DB39A}
.sc-foot{position:relative;z-index:2;font-size:12px;color:#8DB39A;letter-spacing:.04em}
.sc-side{display:flex;align-items:center;justify-content:center;padding:32px}
.sc-card{width:100%;max-width:400px;background:linear-gradient(180deg,rgba(14,48,28,.92),rgba(10,38,21,.92));border:1px solid rgba(84,208,110,.18);border-radius:24px;padding:40px 36px;box-shadow:0 30px 80px rgba(0,0,0,.45);backdrop-filter:blur(8px)}
.sc-card h2{margin:0 0 6px;font-size:24px;font-weight:700}
.sc-card .sc-sub{margin:0 0 28px;font-size:13px;color:#8DB39A}
.sc-label{display:block;font-size:12px;font-weight:600;color:#8DB39A;margin-bottom:8px;letter-spacing:.04em}
.sc-pass{position:relative;margin-bottom:16px}
.sc-pass input{width:100%;font:inherit;font-size:16px;color:#EAF7EE;background:#06200F;border:1px solid rgba(84,208,110,.22);border-radius:14px;padding:15px 50px 15px 16px;outline:0;transition:border-color .15s,box-shadow .15s}
.sc-pass input:focus{border-color:#54D06E;box-shadow:0 0 0 4px rgba(84,208,110,.15)}
.sc-pass input.err{border-color:#F26B6B;box-shadow:0 0 0 4px rgba(242,107,107,.15)}
.staticrypt-toggle-password-visibility{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;cursor:pointer;opacity:.55;filter:invert(1)}
.sc-rem{display:flex;align-items:center;gap:10px;font-size:13px;color:#C9E3D1;margin:4px 0 22px;cursor:pointer}
.sc-rem input{width:18px;height:18px;accent-color:#54D06E}
.sc-btn{width:100%;border:0;border-radius:14px;padding:16px;font:inherit;font-size:15px;font-weight:700;letter-spacing:.04em;color:#00330B;cursor:pointer;background:linear-gradient(135deg,#7BE495,#54D06E 50%,#359D4B);box-shadow:0 12px 30px rgba(84,208,110,.28);transition:transform .12s,filter .12s}
.sc-btn:hover{filter:brightness(1.05);transform:translateY(-1px)}
.sc-msg{min-height:20px;margin-top:14px;font-size:13px;color:#FF9B9B;text-align:center}
@media (max-width:900px){.sc{grid-template-columns:1fr}.sc-hero{min-height:44vh;border-right:0;border-bottom:1px solid rgba(84,208,110,.12)}.sc-lines{display:none}.sc-r1,.sc-r2{display:none}.sc-r3{width:220px;height:220px;right:-60px}}
</style>
